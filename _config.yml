# Site metadata
title: Katie Allred
description: >- # used by jekyll-seo-tag and the feed
  Personal website and blog. Writing about the web, technology, and whatever
  else comes to mind.
url: "" # e.g. https://www.katieallred.com — no trailing slash
baseurl: "" # subpath of your site, e.g. /blog — leave empty for root
author:
  name: Katie Allred
  email: ""
twitter:
  username: "" # handle without the @
social:
  name: Katie Allred
  links: []
  # - https://twitter.com/username
  # - https://github.com/username
  # - https://www.linkedin.com/in/username

lang: en
timezone: America/Chicago

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/

# Pagination (jekyll-paginate, used by index.html / home layout)
paginate: 5
paginate_path: "/page/:num/"

# Content behavior — explicit for predictable migrations
future: false
show_drafts: false
unpublished: false

# Default front matter, so imported posts/pages need less boilerplate
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

feed:
  posts_limit: 20

exclude:
  - .git/
  - .gitignore
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - package.json
  - package-lock.json
  - README.md
  - vendor/
