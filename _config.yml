# Site metadata
title: Katie Allred
description: >- # used by _includes/seo.html and the feed
  Community strategist, AI educator, and consultant. Helping organizations
  harness AI and community to create meaningful connections at scale.
url: "" # set at build time by the Pages workflow; e.g. https://www.katieallred.com
baseurl: "" # subpath of your site, e.g. /blog — leave empty for root
author:
  name: Katie Allred
twitter:
  username: katiejallred # handle without the @
social:
  name: Katie Allred
  links:
    - https://www.linkedin.com/in/katiejallred/
    - https://www.instagram.com/katiejallred/
    - https://x.com/katiejallred
    - https://www.youtube.com/@KatieJAllred
    - https://www.youtube.com/channel/UCIEYFObz7BFd5xTlbSefNrg
    - https://www.facebook.com/katiejallred/

# Canonical contact details, from the design system's Contact & links section.
positioning: >-
  Community strategist, AI educator, and consultant. Helping organizations
  harness AI and community to create meaningful connections at scale.
contact:
  booking: /schedule-a-call/ # on-site page with the TidyCal embed
  booking_external: https://meetwithkatie.com
  location: Nolensville, TN

# Amazon Associates. Every Amazon link on the site gets this tag and
# rel="sponsored" at build time (_plugins/amazon_affiliate.rb), and pages
# with Amazon links show the disclosure (_includes/affiliate-note.html).
amazon:
  tag: kajal04-20

lang: en
timezone: America/Chicago

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/

# Pagination (jekyll-paginate, used by blog/index.html / home layout)
paginate: 10 # one full-width lead post + a 3-column grid of 9
paginate_path: "/blog/page/:num/"

# Content behavior — explicit for predictable migrations
future: false
show_drafts: false
unpublished: false

# Default front matter, so imported posts/pages need less boilerplate
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
  # Search engine ownership files (e.g. Yandex Webmaster) stay out of the sitemap
  - scope:
      path: "yandex_*.html"
    values:
      sitemap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

feed:
  posts_limit: 20

exclude:
  - .git/
  - .gitignore
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - package.json
  - package-lock.json
  - README.md
  - CLAUDE.md
  - MAINTAINING.md
  - scripts/
  - vendor/
