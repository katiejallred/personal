# Site metadata
title: Katie Allred
description: >- # used by jekyll-seo-tag and the feed
  Community strategist, AI educator, and consultant. Helping organizations
  harness AI and community to create meaningful connections at scale.
url: "" # set at build time by the Pages workflow; e.g. https://www.katieallred.com
baseurl: "" # subpath of your site, e.g. /blog — leave empty for root
author:
  name: Katie Allred
  email: katie@katieallred.com
twitter:
  username: katiejallred # handle without the @
social:
  name: Katie Allred
  links:
    - https://www.linkedin.com/in/katiejallred/
    - https://www.instagram.com/katiejallred/
    - https://twitter.com/katiejallred
    - https://www.youtube.com/channel/UCIEYFObz7BFd5xTlbSefNrg
    - https://www.facebook.com/katiejallred/

# Canonical contact details, from the design system's Contact & links section.
positioning: >-
  Community strategist, AI educator, and consultant. Helping organizations
  harness AI and community to create meaningful connections at scale.
contact:
  email: katie@katieallred.com
  phone: 205-299-2980
  phone_tel: "+12052992980"
  booking: https://meetwithkatie.com
  location: Nolensville, TN

lang: en
timezone: America/Chicago

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/

# Pagination (jekyll-paginate, used by blog/index.html / home layout)
paginate: 9
paginate_path: "/blog/page/:num/"

# Content behavior — explicit for predictable migrations
future: false
show_drafts: false
unpublished: false

# Default front matter, so imported posts/pages need less boilerplate
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

feed:
  posts_limit: 20

exclude:
  - .git/
  - .gitignore
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - package.json
  - package-lock.json
  - README.md
  - vendor/
