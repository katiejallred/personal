# Facts about Katie and her business for structured data (JSON-LD in
# _includes/seo.html) and /llms.txt. Search engines and AI answer engines
# read these to decide who Katie is, so keep them matching the press kit.
# Contact details and social links come from _config.yml.
person:
  name: Katie Allred
  job_title: Community strategist, AI educator, author & speaker
  image: /assets/images/katie-allred.jpg
  bio: >-
    Katie Allred is a community strategist, AI educator, and author with more
    than 25 years of experience building online communities. She co-founded an
    online community of more than 35,000 church leaders, led global faith
    partnerships at a Fortune 500 tech company, and managed a 700,000-member
    creative community on Discord. She wrote Church Communications: Methods and
    Marketing (B&H Academic) and co-wrote AI Prompts for Church Leaders. Today
    she helps churches, nonprofits, and mission-driven teams use AI and
    community to free up time for people.
  alumni_of: University of Florida
  # Stated on the About page ("Quick facts") so Wikidata can cite it for
  # sex or gender (P21) and country of citizenship (P27).
  gender: Female
  nationality: United States
  knows_about:
    - Church communications
    - Online community building
    - Community management
    - AI for churches and nonprofits
    - AI policy and governance
    - Social media strategy
    - Nonprofit marketing
    - Crisis communications
  # Author and publisher profiles that describe Katie. Added to the Person's
  # sameAs after the social links in _config.yml, so Google can match her
  # books and bylines elsewhere to this site. Only list pages that are hers.
  same_as:
