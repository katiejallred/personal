# Testimonials shown on /reviews/, grouped by section.
# To add one, append an entry to a group: quote, name, role, org.
# `rating` shows stars (workshop evaluations only). `featured: true` pulls a
# quote out of its grid into the large quote near the top of the page.
# `cta_text`/`cta_url` add a link under a group's reviews.

- id: ai-training
  cta_text: See AI training packages
  cta_url: /services/#svc-ai
  label: AI for ministry training
  title: Churches learning to use AI, hands-on.
  intro: >-
    Katie has trained dozens of ministry leaders, church staff, and
    communicators to use AI tools with confidence. Here's what participants
    said after her hands-on AI for Churches workshops.
  reviews:
    - quote: >-
        I feel very comfortable with my understanding of the various AI apps!
        The clarity of instruction was extremely clear and the hands-on
        activities were extremely helpful.
      name: Nicole Grace Frizzo
      role: Communications Coordinator
      org: Adelynrood Retreat & Conference Center
      rating: 5
    - quote: >-
        The most valuable insight was learning about the camera on ChatGPT,
        recording meetings with Otter.ai, and using Illustrator Generative AI
        to create vector art. It was a real fun workshop. Loved every bit of it!
      name: Angela Hider
      role: Staff
      org: Epicenter
      rating: 5
    - quote: >-
        I gained valuable insights into how to prompt effectively and
        discovered the wide variety of AI tools available. The instruction was
        very clear and helpful. I'm already planning to generate June social
        media content and refine a bishop's appeal letter I started in the
        workshop.
      name: Keely Thrall
      role: Staff
      org: Episcopal Diocese of Washington
      rating: 5
    - quote: >-
        The most helpful aspect was watching how AI works in real time. It
        really expanded my knowledge on how to use ChatGPT. I walked away much
        more comfortable and excited to apply these tools to our ministry
        communications.
      name: Nadirah Majied
      role: Staff
      org: St. Paul's Rock Creek
      rating: 5

