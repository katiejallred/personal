<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}" rel="home">
      <span class="wordmark-tile" aria-hidden="true">KA</span>{{ site.title }}
    </a>
    <nav class="site-nav" aria-label="Primary">
      <ul>
        {%- for item in site.data.navigation %}
        {%- assign item_url = item.url | relative_url %}
        <li><a href="{{ item_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
        <li><a class="btn btn-red btn-sm" href="{{ site.contact.booking | relative_url }}">Book a call</a></li>
      </ul>
    </nav>
  </div>
</header>
