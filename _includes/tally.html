{%- comment -%}
  Tally form embed. Usage: {% include tally.html id="7RGdkz" title="Contact" %}
  Transparent background so the form sits on the page's own colors.
{%- endcomment -%}
<iframe class="tally-embed" data-tally-src="https://tally.so/embed/{{ include.id }}?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="320" frameborder="0" marginheight="0" marginwidth="0" title="{{ include.title | escape }}"></iframe>
<script>var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function(e){e.src=e.dataset.tallySrc})};if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w,s.onload=v,s.onerror=v,d.body.appendChild(s);}</script>
