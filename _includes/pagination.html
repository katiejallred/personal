<nav class="pagination" aria-label="Pagination">
  {%- if paginator.previous_page %}
  <a class="pagination-prev" href="{{ paginator.previous_page_path | relative_url }}" rel="prev">&larr; Newer posts</a>
  {%- endif %}
  <span class="pagination-status">Page {{ paginator.page }} of {{ paginator.total_pages }}</span>
  {%- if paginator.next_page %}
  <a class="pagination-next" href="{{ paginator.next_page_path | relative_url }}" rel="next">Older posts &rarr;</a>
  {%- endif %}
</nav>
