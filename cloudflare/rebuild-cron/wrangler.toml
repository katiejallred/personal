# Optional: deploy from the command line with `npx wrangler deploy` in this
# folder (then `npx wrangler secret put GITHUB_TOKEN`). Creating the Worker
# in the Cloudflare dashboard and pasting worker.js works just as well.
name = "katieallred-rebuild-cron"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
crons = ["5 * * * *"]
