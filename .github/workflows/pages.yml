# Build the Jekyll site and deploy it to GitHub Pages.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "Submit every URL in the sitemap to IndexNow, not just changed ones"
        type: boolean
        default: false
  # Rebuild daily so future-dated posts (future: false) go live on their
  # publish date; this also keeps the footer's copyright year current.
  schedule:
    - cron: "15 14 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Pillow draws the Open Graph share cards (_plugins/og_images.rb).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow

      - id: pages
        uses: actions/configure-pages@v5

      # url/baseurl come from Pages, so the build is right for a project
      # site (/personal) today and for a custom domain later. Pages reports
      # an http:// origin until "Enforce HTTPS" is on; always build with
      # https so canonical URLs and structured data don't split the site.
      - name: Build
        id: build
        run: |
          origin="${{ steps.pages.outputs.origin }}"
          origin="${origin/#http:\/\//https://}"
          echo "url: \"$origin\"" > _config.pages.yml
          bundle exec jekyll build --config _config.yml,_config.pages.yml --baseurl "${{ steps.pages.outputs.base_path }}"
          echo "site_url=$origin${{ steps.pages.outputs.base_path }}" >> "$GITHUB_OUTPUT"
        env:
          JEKYLL_ENV: production

      # Compare the new sitemap with the one still live, before deploying
      # replaces it; the indexnow job submits the difference afterwards.
      - name: List changed URLs for IndexNow
        if: github.event_name != 'pull_request'
        run: |
          python3 scripts/indexnow.py list --site _site \
            --live "${{ steps.build.outputs.site_url }}/sitemap.xml" \
            ${{ inputs.indexnow_all && '--all' || '' }} > indexnow-urls.txt
          cat indexnow-urls.txt

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: indexnow-urls
          path: indexnow-urls.txt
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'

    outputs:
      site_url: ${{ steps.build.outputs.site_url }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Ping search engines (Bing, Yandex, Naver, Seznam, Yep…) about the pages
  # this deploy added, changed or removed. See scripts/indexnow.py.
  indexnow:
    if: github.event_name != 'pull_request'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-urls
      - name: Submit to IndexNow
        run: |
          python3 scripts/indexnow.py submit --urls indexnow-urls.txt \
            --site-url "${{ needs.build.outputs.site_url }}"
