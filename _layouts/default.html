<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- include seo.html %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Caveat:wght@600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <meta name="theme-color" content="#D92B20">
  {% feed_meta %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  {% include header.html %}

  <main id="main-content">
    {{ content }}
    {%- if page.affiliate_links and page.layout != 'post' and page.affiliate_note != 'inline' %}
    <div class="affiliate-band">
      <div class="wrap">{% include affiliate-note.html %}</div>
    </div>
    {%- endif %}
  </main>

  {% include footer.html %}
</body>
</html>
