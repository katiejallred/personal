---
layout: default
---
<article class="article">
  <header>
    {%- if page.eyebrow %}
    <p class="label">{{ page.eyebrow }}</p>
    {%- endif %}
    <h1 class="article-title">{{ page.title }}</h1>
    {%- if page.description %}
    <p class="section-intro">{{ page.description }}</p>
    {%- endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
